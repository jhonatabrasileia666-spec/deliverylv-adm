name: Guard pizza base price editing
on:
  push:
    paths:
      - '.github/workflows/fix-pizza-editor-price.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guard
        run: python3 .github/scripts/fix_pizza_editor_price.py
      - name: Commit guard
        run: |
          rm .github/workflows/fix-pizza-editor-price.yml .github/scripts/fix_pizza_editor_price.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-pizza-editor-price.yml .github/scripts/fix_pizza_editor_price.py
          git diff --cached --check
          git commit -m "fix: guard pizza base price editing"
          git push
