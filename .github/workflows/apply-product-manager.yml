name: Apply product manager update
on:
  push:
    paths:
      - '.github/workflows/apply-product-manager.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply product manager patch
        run: python3 .github/scripts/add_product_manager.py
      - name: Validate patch
        run: |
          grep -q 'data-add-product' index.html
          grep -q 'function openProductCreator' index.html
          grep -q 'product-images' index.html
          git diff --check
      - name: Commit product manager
        run: |
          rm .github/scripts/add_product_manager.py
          rm .github/workflows/apply-product-manager.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/scripts/add_product_manager.py .github/workflows/apply-product-manager.yml
          git commit -m "feat: add flexible product manager"
          git push
