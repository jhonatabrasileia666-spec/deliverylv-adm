name: Prelaunch cleanup

on:
  push:
    paths:
      - '.github/workflows/prelaunch-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'chore: run prelaunch cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clean prelaunch leftovers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          # Remove the hidden fake-receipt test helper from production.
          text, removed = re.subn(
              r"\n  function testHidden\(\)\{.*?\n  \}\n\n  // Detect only genuinely new orders",
              "\n\n  // Detect only genuinely new orders",
              text,
              count=1,
              flags=re.S,
          )
          if removed != 1:
              raise SystemExit('Expected hidden print test helper was not found exactly once')
          text = text.replace(
              'window.LVPrinting={config:CONFIG,printNormal,buildReceipt,retryQueue,testHidden,_queue:queue};',
              'window.LVPrinting={config:CONFIG,printNormal,buildReceipt,retryQueue,_queue:queue};'
          )

          # Remove demo-only styling left from the prototype phase.
          text = re.sub(r'\.demo-pill\{[^}]*\}\.demo-pill i\{[^}]*\}', '', text, count=1)
          text = re.sub(r'\.demo-controls\{[^}]*\}\.demo-controls p\{[^}]*\}\.demo-controls strong\{[^}]*\}', '', text, count=1)
          text = text.replace('.demo-controls{align-items:flex-start;flex-direction:column}.demo-controls .button{width:100%}', '')
          text = text.replace('.top-status,.demo-pill,#account-label{display:none}', '.top-status,#account-label{display:none}')

          # Production copy / navigation cleanup.
          text = text.replace('Pedido #1047 de Ana chegou agora.', 'Aguardando novos pedidos.')
          text = text.replace("financeNav.innerHTML='<i data-lucide=\"calculator\"></i><span>Logística</span>';", "financeNav.innerHTML='<i data-lucide=\"calculator\"></i><span>Financeiro</span>';")
          text = text.replace('.nav{grid-template-columns:repeat(4,1fr);height:100%}', '.nav{grid-template-columns:repeat(6,minmax(0,1fr));height:100%}')
          text = text.replace('.nav-item{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:5px 2px;border-radius:8px;font-size:9px}', '.nav-item{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:5px 1px;border-radius:8px;font-size:8px}')

          if text == original:
              raise SystemExit('Cleanup made no changes')
          if 'function testHidden()' in text or 'testHidden,_queue' in text:
              raise SystemExit('Hidden print test helper still present')
          if '>Logística</span>' in text:
              raise SystemExit('Old Financeiro label still present')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I)
          checked = 0
          for i, code in enumerate(scripts):
              if not code.strip() or 'src=' in code[:100]:
                  continue
              tmp = Path(f'/tmp/delivery-lv-admin-{i}.js')
              tmp.write_text(code, encoding='utf-8')
              subprocess.run(['node', '--check', str(tmp)], check=True)
              checked += 1
          print(f'Validated {checked} inline scripts')
          PY
      - name: Commit clean production file and remove temporary workflow
        run: |
          rm -f .github/workflows/prelaunch-cleanup.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: clean admin for client handoff'
          git push
