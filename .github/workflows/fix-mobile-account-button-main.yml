name: Fix mobile account button on main

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-mobile-account-button-main.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch mobile account button
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.top-status,.demo-pill,.user span{display:none}'
          new = '.top-status,.demo-pill,#account-label{display:none}'
          if old not in s:
              raise SystemExit('mobile account CSS marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          assert old not in s
          assert new in s
          PY

      - name: Commit only the mobile fix
        run: |
          rm -f .github/workflows/fix-mobile-account-button-main.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-mobile-account-button-main.yml
          git commit -m 'fix: show account button on mobile'
          git push origin HEAD:main
