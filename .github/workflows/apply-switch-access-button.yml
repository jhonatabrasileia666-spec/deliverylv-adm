name: Apply switch access button
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_switch_access_button.py'
      - '.github/workflows/apply-switch-access-button.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch switch access
        run: python .github/scripts/add_switch_access_button.py
      - name: Validate switch access
        run: |
          grep -q 'id="switch-access-button"' index.html
          grep -q 'Trocar acesso' index.html
          grep -q "clearPanelSession({serverLogout:true" index.html
      - name: Commit final change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/add_switch_access_button.py .github/workflows/apply-switch-access-button.yml
          git add -A
          git commit -m "feat: add switch access button"
          git push
