name: Apply payment confirmation step 3

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-payment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin
        run: python3 .github/scripts/fix_payment_step3.py
      - name: Commit fix
        run: |
          rm -f .github/workflows/fix-payment-step3.yml
          rm -f .github/scripts/fix_payment_step3.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: confirm payment before finance"
          git push origin HEAD:main
