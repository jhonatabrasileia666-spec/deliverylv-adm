name: Apply stronger alert sound
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/boost_alert_sound.py'
      - '.github/workflows/apply-strong-alert-sound.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch alert sound
        run: python .github/scripts/boost_alert_sound.py
      - name: Validate alert sound
        run: |
          grep -q "master.gain.setValueAtTime(.72" index.html
          grep -q "osc.type=index%2?'sawtooth':'square'" index.html
      - name: Commit final change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/boost_alert_sound.py .github/workflows/apply-strong-alert-sound.yml
          git add -A
          git commit -m "feat: make active alert sound louder"
          git push
