name: Apply delivery drivers tab
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_delivery_drivers.py'
      - '.github/workflows/apply-delivery-drivers.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin drivers tab
        run: python .github/scripts/add_delivery_drivers.py
      - name: Validate drivers tab
        run: |
          grep -q 'data-view="drivers"' index.html
          grep -q 'view-drivers' index.html
          grep -q 'delivery_drivers' index.html
          grep -q 'Cadastrar entregador' index.html
          grep -q 'repeat(6,1fr)' index.html
      - name: Commit final change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/add_delivery_drivers.py .github/workflows/apply-delivery-drivers.yml
          git add -A
          git commit -m "feat: add delivery drivers management"
          git push
