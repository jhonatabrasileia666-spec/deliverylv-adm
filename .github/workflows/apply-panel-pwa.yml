name: Apply panel PWA integration
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/enable_panel_pwa.py'
      - '.github/workflows/apply-panel-pwa.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python .github/scripts/enable_panel_pwa.py
      - name: Validate PWA integration
        run: |
          grep -q 'manifest.webmanifest' index.html
          grep -q 'panel-pwa-module' index.html
          grep -q 'notification-sw.js' index.html
          grep -q 'pwa-install-button' index.html
          test -f manifest.webmanifest
          test -f notification-sw.js
          test -f pwa-icon-192.svg
          test -f pwa-icon-512.svg
      - name: Commit final change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/enable_panel_pwa.py .github/workflows/apply-panel-pwa.yml
          git add -A
          git commit -m "feat: make admin panel installable PWA"
          git push
