name: Apply custom category support
on:
  push:
    paths:
      - '.github/workflows/apply-custom-category.yml'
      - '.github/scripts/add_custom_category.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/add_custom_category.py
      - name: Verify markers
        run: |
          grep -q 'Criar nova categoria' index.html
          grep -q 'edit-product-new-category' index.html
          grep -q "db.from('categories').insert" index.html
      - name: Commit clean result
        run: |
          rm -f .github/scripts/add_custom_category.py .github/workflows/apply-custom-category.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: allow creating product categories'
          git push
