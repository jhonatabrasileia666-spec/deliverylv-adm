name: Apply public order code search
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_order_code_search.py'
      - '.github/workflows/apply-order-code-search.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin history
        run: python .github/scripts/add_order_code_search.py
      - name: Validate order code search
        run: |
          grep -q "history-search" index.html
          grep -q "order_code" index.html
          grep -q "orderCode" index.html
          grep -q "Pesquisar por nome" index.html
      - name: Commit final change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/add_order_code_search.py .github/workflows/apply-order-code-search.yml
          git add -A
          git commit -m "feat: add order code search to history"
          git push
