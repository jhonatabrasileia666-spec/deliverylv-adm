name: Apply Caldo-style alert siren
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/copy-caldo-siren.py'
      - '.github/workflows/apply-caldo-siren.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Caldo-style siren
        run: python .github/scripts/copy-caldo-siren.py
      - name: Validate siren
        run: |
          grep -q "tone(880,.25,0)" index.html
          grep -q "tone(1200,.25,300)" index.html
          grep -q "interval:3000" index.html
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const parts=[...s.matchAll(/<script[^>]*>([\\s\\S]*?)<\\/script>/g)].map(m=>m[1]).filter(Boolean);parts.forEach((code,i)=>{try{new Function(code)}catch(e){console.error('script',i,e.message);process.exit(1)}})"
      - name: Commit final change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/copy-caldo-siren.py .github/workflows/apply-caldo-siren.yml
          git add -A
          git commit -m "feat: use proven Caldo-style order siren"
          git push
