name: Apply payment before finalized flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-payment-before-finalized.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply flow correction
        run: python3 .github/scripts/fix_payment_before_done.py
      - name: Validate diff
        run: git diff --check
      - name: Commit corrected index
        run: |
          rm -f .github/scripts/fix_payment_before_done.py
          rm -f .github/workflows/apply-payment-before-finalized.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: confirm payment before finalized"
          git push origin HEAD:main
