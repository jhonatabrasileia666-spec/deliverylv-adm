name: Fix new category field binding
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-new-category-field.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix field binding
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="const newCategoryName=document.querySelector('#edit-new-category')?.value.trim()||'';"
          new="const newCategoryName=(document.querySelector('#edit-product-new-category')||document.querySelector('#edit-new-category'))?.value.trim()||'';"
          if old not in s:
              raise SystemExit('runtime new category field binding not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit and cleanup
        run: |
          rm -f .github/workflows/fix-new-category-field.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github
          git commit -m 'fix: bind flexible category name field' || exit 0
          git push
