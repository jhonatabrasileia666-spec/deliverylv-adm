name: Apply driver login dashboard
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_driver_login.py'
      - '.github/workflows/apply-driver-login.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch driver login
        run: python .github/scripts/add_driver_login.py
      - name: Validate driver login
        run: |
          grep -q 'id="driver-login-module"' index.html
          grep -q 'data-login-mode="driver"' index.html
          grep -q 'id="driver-app"' index.html
          grep -q 'lv_driver_claim_order' index.html
          grep -q 'driver-pin' index.html
      - name: Commit final change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/add_driver_login.py .github/workflows/apply-driver-login.yml
          git add -A
          git commit -m "feat: add driver login and delivery dashboard"
          git push
