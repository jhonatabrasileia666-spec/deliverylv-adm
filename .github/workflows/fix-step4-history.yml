name: Apply step 4 history fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-step4-history.yml'

permissions:
  contents: write

jobs:
  patch-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch history and clean up
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = "const rows=orders.filter(o=>['done','delivery','cancelled'].includes(o.status)).sort((a,b)=>b.id-a.id);"
          new = "const rows=orders.filter(o=>(o.status==='done'&&o.paymentStatus==='paid')||o.status==='cancelled').sort((a,b)=>b.id-a.id);"
          if old not in text:
              raise SystemExit('Trecho esperado do Histórico não encontrado; abortando sem alterar o index.')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-step4-history.yml
          git commit -m "fix: show only finished orders in history"
          git push