name: Apply final production hardening

on:
  push:
    paths:
      - '.github/workflows/apply-final-production-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply production hardening
        run: python .github/scripts/final-production-hardening.py
      - name: Validate markers
        run: |
          grep -q 'id="store-toggle-button"' index.html
          grep -q 'async function toggleStoreStatus()' index.html
          grep -q 'escapeMenuText(order.customer)' index.html
          grep -q 'escapeMenuText(item.detail)' index.html
          grep -q 'formatHistoryDate(order.createdAt)' index.html
          ! grep -q '<span>Hoje<small>${order.time}</small></span>' index.html
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/admin-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/admin-inline.js
      - name: Commit result and remove temporary automation
        run: |
          rm -f .github/scripts/final-production-hardening.py .github/workflows/apply-final-production-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden admin and add store status control'
          git push
