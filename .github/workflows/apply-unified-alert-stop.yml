name: Apply unified alert stop cleanup

on:
  push:
    paths:
      - '.github/workflows/apply-unified-alert-stop.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply alert cleanup
        run: python .github/scripts/unify-alert-stop.py
      - name: Validate result
        run: |
          grep -q "icon:'./pwa-icon-192.svg'" index.html
          grep -q 'function stopAll()' index.html
          grep -q 'stopAll,enable' index.html
          grep -q 'LVBackgroundPush?.stopCurrent' index.html
          ! grep -q "icon:'./icon-192.png'" index.html
      - name: Commit fix and remove temporary automation
        run: |
          rm -f .github/scripts/unify-alert-stop.py .github/workflows/apply-unified-alert-stop.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: unify alert stop behavior and notification icon'
          git push
