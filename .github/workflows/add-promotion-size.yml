name: Add promotion size

on:
  push:
    branches: [work-deliverylv-adm]
    paths:
      - '.github/scripts/add-promotion-size.py'
      - '.github/workflows/add-promotion-size.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work-deliverylv-adm
          fetch-depth: 0
      - name: Preserve patch
        run: cp .github/scripts/add-promotion-size.py /tmp/add-promotion-size.py
      - name: Patch main
        shell: bash
        run: |
          set -euo pipefail
          git checkout main
          git pull --ff-only origin main
          python /tmp/add-promotion-size.py
          python - <<'PY'
          import re,pathlib
          text=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts='\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S))
          pathlib.Path('/tmp/admin.js').write_text(scripts,encoding='utf-8')
          assert 'promotion_size' in text
          assert 'data-promotion-size' in text
          PY
          node --check /tmp/admin.js
          git config user.name 'jhonatabrasileia666-spec'
          git config user.email 'jhonata.brasileia666@gmail.com'
          git add index.html
          git diff --cached --check
          git commit -m 'feat: choose promotion size' || exit 0
          git push origin main
